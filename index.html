<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>거룡아이티 대표 페이지</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background-color: #f4f6f8;
            color: #222222;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Noto Sans KR", Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        .card {
            padding: 28px 22px;
            background-color: #ffffff;
            border: 1px solid #e1e5e9;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .badge {
            display: inline-block;
            margin-bottom: 14px;
            padding: 6px 10px;
            background-color: #eaf2ff;
            color: #175cd3;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 25px;
            line-height: 1.4;
        }

        .description {
            margin: 0 0 24px;
            color: #555555;
            font-size: 16px;
            line-height: 1.7;
        }

        .version-box {
            margin-bottom: 22px;
            padding: 16px;
            background-color: #f8f9fa;
            border-radius: 10px;
            line-height: 1.8;
        }

        .label {
            color: #666666;
        }

        .download-button {
            display: block;
            width: 100%;
            padding: 15px 18px;
            background-color: #175cd3;
            color: #ffffff;
            border-radius: 9px;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
        }

        .download-button:active {
            background-color: #124aab;
        }

        .notice {
            margin: 20px 2px 0;
            color: #666666;
            font-size: 14px;
            line-height: 1.6;
        }

        footer {
            margin-top: 22px;
            color: #777777;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="card">
            <div class="badge">공식 배포 페이지</div>

            <h1>거룡아이티 대표 페이지</h1>

            
        </section>

        <footer>
            운영 및 배포: GRIT POS
        </footer>
    </main>
</body>
</html>
